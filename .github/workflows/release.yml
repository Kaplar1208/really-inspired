name: Release
# Se dispara solo cuando module.json cambia en un push a main (o sea, cuando
# subes un bump de versión), y también se puede lanzar a mano desde la
# pestaña "Actions" de GitHub por si hay que reintentar algo.
on:
  push:
    branches: [main]
    paths:
      - module.json
  workflow_dispatch:
# El token automático de GitHub necesita permiso de escritura para poder
# crear el tag y el Release.
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Leer versión desde module.json
        id: version
        run: |
          VERSION=$(node -p "require('./module.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
      - name: Revisar si ya existe un Release para esta versión
        id: check_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ steps.version.outputs.tag }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo